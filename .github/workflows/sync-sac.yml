name: Sync sac from ssh-alias-creator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: archi3

      - name: Fetch latest sac
        run: curl -fsSL https://raw.githubusercontent.com/eth-man/ssh-alias-creator/main/sac -o .local/bin/tools/sac

      - name: Commit and push if changed
        run: |
          chmod +x .local/bin/tools/sac
          if git diff --quiet -- .local/bin/tools/sac; then
            echo "sac is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .local/bin/tools/sac
          git commit -m "Sync sac from ssh-alias-creator"
          git push origin HEAD:archi3
